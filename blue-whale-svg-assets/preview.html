<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blue Whale SVG Assets</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:32px;background:#f5f7f9;color:#11232d}
main{max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
object{display:block;width:100%;height:300px}
h1{margin-top:0} h2{font-size:1rem;margin-bottom:12px}
small{opacity:.65}
</style>
</head>
<body><main>
<h1>Blue Whale SVG Asset Preview</h1>
<p><small>Static preview. The animatable files contain stable IDs for GSAP.</small></p>
<div class="grid">
<div class="card"><h2>Full master logo</h2><object data="blue-whale-logo-master.svg" type="image/svg+xml"></object></div>
<div class="card"><h2>Isolated mark</h2><object data="blue-whale-mark.svg" type="image/svg+xml"></object></div>
<div class="card"><h2>Animatable mark</h2><object data="blue-whale-mark-animatable.svg" type="image/svg+xml"></object></div>
<div class="card"><h2>Spout overlay</h2><object data="blue-whale-spout-overlay.svg" type="image/svg+xml"></object></div>
</div>
</main></body></html>
